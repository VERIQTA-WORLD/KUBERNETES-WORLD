<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#f4faf7"/><g font-family="Arial"><text x="70" y="85" font-size="43" fill="#0a7c66">Kubernetes cluster architecture</text><text x="70" y="130" font-size="22" fill="#254638">Conceptual component view. Not a deployment manifest.</text><rect x="70" y="190" width="940" height="450" rx="16" fill="#e5edf8" stroke="#326ce5" stroke-width="3"/><text x="100" y="235" font-size="28" fill="#326ce5">Control plane</text><rect x="330" y="275" width="420" height="85" rx="8" fill="#326ce5"/><text x="540" y="328" text-anchor="middle" font-size="28" fill="white">kube-apiserver</text><rect x="110" y="445" width="260" height="90" rx="8" fill="white" stroke="#326ce5"/><text x="240" y="495" text-anchor="middle" font-size="22">kube-scheduler</text><rect x="410" y="445" width="260" height="90" rx="8" fill="white" stroke="#326ce5"/><text x="540" y="486" text-anchor="middle" font-size="20">kube-controller-</text><text x="540" y="511" text-anchor="middle" font-size="20">manager</text><rect x="710" y="445" width="260" height="90" rx="8" fill="white" stroke="#326ce5"/><text x="840" y="495" text-anchor="middle" font-size="24">etcd</text><rect x="70" y="730" width="440" height="420" rx="16" fill="#e1f1de" stroke="#0a7c66" stroke-width="3"/><rect x="570" y="730" width="440" height="420" rx="16" fill="#e1f1de" stroke="#0a7c66" stroke-width="3"/><text x="100" y="780" font-size="28" fill="#0a7c66">Worker node A</text><rect x="110" y="830" width="360" height="65" rx="8" fill="white" stroke="#0a7c66"/><text x="290" y="871" text-anchor="middle" font-size="23">kubelet</text><rect x="110" y="930" width="360" height="65" rx="8" fill="white" stroke="#0a7c66"/><text x="290" y="971" text-anchor="middle" font-size="23">Container runtime</text><rect x="110" y="1030" width="360" height="65" rx="8" fill="white" stroke="#0a7c66"/><text x="290" y="1071" text-anchor="middle" font-size="23">Pods and containers</text><text x="600" y="780" font-size="28" fill="#0a7c66">Worker node B</text><rect x="610" y="830" width="360" height="65" rx="8" fill="white" stroke="#0a7c66"/><text x="790" y="871" text-anchor="middle" font-size="23">kubelet</text><rect x="610" y="930" width="360" height="65" rx="8" fill="white" stroke="#0a7c66"/><text x="790" y="971" text-anchor="middle" font-size="23">Container runtime</text><rect x="610" y="1030" width="360" height="65" rx="8" fill="white" stroke="#0a7c66"/><text x="790" y="1071" text-anchor="middle" font-size="23">Pods and containers</text><g fill="none" stroke="#254638" stroke-width="3"><path d="M450 360L240 445M540 360V445M640 360L840 445"/><path d="M330 317H35V862H110M750 317H1045V862H970"/><path d="M290 895V930M290 995V1030M790 895V930M790 995V1030"/></g><text x="70" y="1225" font-size="21" fill="#254638">Networking and storage plugins support workload connectivity and volumes.</text><text x="70" y="1280" font-size="22" fill="#0a7c66">VERIQTA. Lines indicate component relationships.</text></g></svg>