mbus Sans, sans-serif" font-size="27" font-weight="bold" fill="#67E8A5">SCHEDULER</text><text x="426" y="723" font-family="Arial, Nimbus Sans, sans-serif" font-size="24" font-weight="normal" fill="#F1FAF5">Place Pods</text><rect x="725" y="638" width="275" height="150" rx="18" fill="#143D30"/><text x="751" y="685" font-family="Arial, Nimbus Sans, sans-serif" font-size="27" font-weight="bold" fill="#67E8A5">CONTROLLERS</text><text x="751" y="723" font-family="Arial, Nimbus Sans, sans-serif" font-size="24" font-weight="normal" fill="#F1FAF5">Reconcile state</text><path d="M216 555L216 638" stroke="#67E8A5" stroke-width="4"/><path d="M540 555L540 638" stroke="#67E8A5" stroke-width="4"/><path d="M860 555L860 638" stroke="#67E8A5" stroke-width="4"/><rect x="80" y="918" width="920" height="176" rx="18" fill="#143D30"/><text x="106" y="965" font-family="Arial, Nimbus Sans, sans-serif" font-size="27" font-weight="bold" fill="#67E8A5">WORKER NODE</text><text x="106" y="1003" font-family="Arial, Nimbus Sans, sans-serif" font-size="24" font-weight="normal" fill="#F1FAF5">kubelet coordinates execution through the container runtime.</text><path d="M980 555L980 918" stroke="#67E8A5" stroke-width="4"/><text x="80" y="1180" font-family="Arial, Nimbus Sans, sans-serif" font-size="25" font-weight="normal" fill="#A8C7BE">Components watch and interact through the API.</text></svg>